<style>
  .port-wrap { max-width: 1200px; margin: 0 auto; padding: 120px 40px 60px; }
  .port-wrap h1 { font-size: 42px; margin: 0 0 10px; color: var(--text-bright); }
  .port-wrap .sub { opacity: .7; margin-bottom: 40px; color: var(--text-dim); }
  .port-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 24px; }
  .port-grid figure { 
    margin: 0; background: var(--bg-card); border-radius: var(--radius-lg); 
    overflow: hidden; border: 1px solid var(--border); transition: transform 0.3s;
  }
  .port-grid figure:hover { transform: translateY(-4px); border-color: var(--accent); }
  .port-grid figure img { width: 100%; display: block; }
  .port-grid figcaption { padding: 14px 18px; font-family: var(--mono); color: var(--accent); font-size: 0.9rem; }
</style>
</head>

    <figure><img src="04-ai-chatbot.png" alt="04-ai-chatbot"/><figcaption>04-ai-chatbot.png</figcaption></figure>
    <figure><img src="05-ai-engineering.png" alt="05-ai-engineering"/><figcaption>05-ai-engineering.png</figcaption></figure>
  </div>
</div>

<site-footer root=".."></site-footer>

<script src="../js/components.js"></script>

</body>
