name: Verify Dashboards

# Runs verify_dashboard.py on dashboards.js + the 3 dashboard HTML files.
# Mirrors the local pre-commit hook at .git/hooks/pre-commit.
# Any JS syntax error or aria-hidden coverage regression aborts the build.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify-dashboards:
    name: verify_dashboard.py (4 files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Smoke-test dashboards.js
        run: node tools/test_dashboards.js

      - name: Verify dashboards.js
        run: python COMPLETED_PROJECTS/mobile_backup/verify_dashboard.py dashboards.js

      - name: Verify UNIFIED_MASTER_DASHBOARD.html
        run: python COMPLETED_PROJECTS/mobile_backup/verify_dashboard.py UNIFIED_MASTER_DASHBOARD.html

      - name: Verify AI_TOOLS_DASHBOARD.html
        run: python COMPLETED_PROJECTS/mobile_backup/verify_dashboard.py AI_TOOLS_DASHBOARD.html

      - name: Verify AUSAI_OPS_DASHBOARD.html
        run: python COMPLETED_PROJECTS/mobile_backup/verify_dashboard.py AUSAI_OPS_DASHBOARD.html
