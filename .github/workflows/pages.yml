# GitHub Actions workflow — auto-deploys static HTML to GitHub Pages on every push to main.
# ⚠️ ONE-TIME MANUAL SETUP REQUIRED before first deploy succeeds:
#   Repo → Settings → Pages → Source: switch from "Deploy from a branch" (default) to "GitHub Actions" → Save.
#   After that toggle, every push to `main` triggers this workflow and goes live automatically.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
