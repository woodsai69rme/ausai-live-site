# CI Pipeline for Archon V2 Alpha
# Uses uv (per CLAUDE.md) -- not pip/flake8/black/isort.

name: CI Pipeline

on:
  push:
    branches: [main, develop, 'release/*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ============================================
  # LINTING & TYPE CHECKING
  # ============================================
  lint:
    name: Linting & Type Checking (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: python
        run: uv sync --group dev

      - name: Ruff lint
        working-directory: python
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        working-directory: python
        run: uv run ruff format --check src/ tests/

      - name: Mypy type check
        working-directory: python
        run: uv run mypy src/

  # ============================================
  # FRONTEND LINT / TYPE CHECK / TEST / BUILD
  # ============================================
  frontend:
    name: Frontend (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: archon-ui-main/package-lock.json

      - name: Install dependencies
        working-directory: archon-ui-main
        run: npm ci

      - name: ESLint
        working-directory: archon-ui-main
        run: npm run lint

      - name: TypeScript type check
        working-directory: archon-ui-main
        run: npx tsc --noEmit

      - name: Run Vitest
        working-directory: archon-ui-main
        run: npm run test:coverage:run

      - name: Build
        working-directory: archon-ui-main
        run: npm run build

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-test-results
          path: archon-ui-main/public/test-results/test-results.json
          retention-days: 30

  # ============================================
  # UNIT TESTS WITH COVERAGE
  # ============================================
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (with test extras)
        working-directory: python
        run: uv sync --group dev --extra test

      - name: Run unit tests
        working-directory: python
        run: |
          # Threshold chosen low to avoid blocking the first CI run before
          # the test suite reaches steady-state coverage.
          uv run pytest tests/ \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=50 \
            --junitxml=junit/test-results.xml \
            -v --tb=short

      - name: Upload coverage XML to Codecov
        if: always()
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: python/coverage.xml
          flags: backend
          name: backend-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-results
          path: python/junit/test-results.xml
          retention-days: 30

  # ============================================
  # DOCKER BUILD CHECK
  # ============================================
  docker-build:
    name: Docker Build (server)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build server image
        run: |
          docker build \
            --file python/Dockerfile.server \
            --tag archon-server:ci \
            --build-arg ARCHON_SERVER_PORT=8181 \
            python/

  # ============================================
  # LOCKSTEP-INVARIANT PYTEST (workspace-level)
  # ============================================
  # Cont.17-fup-10: enforces cross-file invariants the regular backend pytest
  # suite cannot see (e.g., music_video_studio.FREE_MODELS in Python must stay
  # in lockstep with openrouter_free_models.txt). Caught a real
  # OPENROUTER_NAMESPACE_PREFIXES routing bug on its first local run.
  lockstep:
    name: Lockstep-invariant pytest (workspace-level)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "latest"

      - name: Run lockstep-invariant pytest
        # --no-project: the test lives at repo root, not under python/ backend.
        # --with pytest: spins up a transient env containing only pytest on demand
        # (pytest-cov is intentionally excluded; the root pyproject.toml addopts
        # pull in --cov=src which is irrelevant for this workspace-level invariant).
        # -o addopts= strips the cov flags so pytest won't try to load the absent
        # pytest-cov plugin. --junit-xml writes the artifact the next step uploads.
        run: |
          uv run --no-project --with pytest python -m pytest \
            -o "addopts=-ra -q --strict-markers --strict-config" \
            --junit-xml=lockstep-junit.xml \
            tests/unit/test_openrouter_lockstep.py -v --tb=short

      - name: Upload lockstep-test junit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lockstep-test-results
          path: lockstep-junit.xml
          retention-days: 30

  # ============================================
  # SECRET SCAN
  # ============================================
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: List changed files
        id: changed-files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > changed-files.txt || true
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt || true
          fi
          if [ ! -s changed-files.txt ]; then
            git diff --name-only HEAD^ HEAD > changed-files.txt || true
          fi

      - name: Scan changed files for high-confidence credentials
        run: python SECURITY/secret_scan.py --paths-file changed-files.txt

      - name: Validate security documentation and workflow pins
        run: python SECURITY/validate_security_docs.py

  # ============================================
  # SUMMARY
  # ============================================
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, lockstep]    # cont.17-fup-10: surface lockstep status in the run summary
    if: always()

    steps:
      - name: Coverage status
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f python/coverage.xml ]; then
            echo "Coverage report generated successfully." >> $GITHUB_STEP_SUMMARY
            echo "See Codecov dashboard for line-by-line breakdown." >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report was not produced." >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f archon-ui-main/public/test-results/test-results.json ]; then
            echo "Frontend test results: archon-ui-main/public/test-results/test-results.json" >> $GITHUB_STEP_SUMMARY
          else
            echo "Frontend test results were not produced." >> $GITHUB_STEP_SUMMARY
          fi
