<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 320px; font-family: sans-serif; background: #0f172a; color: #fff; padding: 1rem; }
        h3 { color: #00f2fe; margin-top: 0; }
        textarea { width: 100%; height: 70px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; padding: 6px; }
        button { width: 100%; background: #00f2fe; color: #000; border: none; padding: 8px; font-weight: bold; border-radius: 6px; margin-top: 8px; cursor: pointer; }
        .pro-badge { background: #ff007a; color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; float: right; }
    </style>
</head>
<body>
    <h3>LinkedIn Craft AI <span class="pro-badge">PRO ($9/mo)</span></h3>
    <p style="font-size: 0.8rem; color: #94a3b8;">Paste post snippet to generate engaging response:</p>
    <textarea id="post-input" placeholder="Paste post text..."></textarea>
    <button onclick="generate()">Generate Pro Comment</button>
    <div id="output" style="margin-top: 10px; font-size: 0.85rem; color: #00dfa2;"></div>
    <script>
        function generate() {
            document.getElementById('output').textContent = '💡 "Great perspective! I completely agree regarding scalable automation systems..."';
        }
    </script>
</body>
</html>
