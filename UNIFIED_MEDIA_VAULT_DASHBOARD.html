<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDIA VAULT STUDIO — Unified Downloads/dll & X: Drive Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090e;
      --bg-surface: #0e121a;
      --bg-card: #141923;
      --bg-card-hover: #1b2230;
      --border: #1f2736;
      --cyan: #00f3ff;
      --green: #10b981;
      --pink: #ff0055;
      --yellow: #f59e0b;
      --purple: #a855f7;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --shadow: 0 10px 30px -10px rgba(0,0,0,0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    code, pre, .mono { font-family: 'JetBrains Mono', monospace; }

    header {
      background: rgba(14, 18, 26, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #00f3ff, #ff0055, #a855f7);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 18px rgba(0, 243, 255, 0.4);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--cyan);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .source-tabs {
      display: flex;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 4px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .tab-btn:hover { color: #fff; }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--cyan);
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .tab-btn.active.tab-x {
      color: var(--purple);
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 13px;
      border-radius: var(--radius-md);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover { background: var(--bg-card-hover); border-color: var(--text-muted); color: #fff; }
    .btn-cyan { background: var(--cyan); color: #000; border: none; font-weight: 700; }
    .btn-cyan:hover { background: #38bdf8; }

    .auto-refresh-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: var(--radius-md);
      font-size: 12px;
    }
    .auto-refresh-select {
      background: transparent;
      color: var(--cyan);
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }
    .auto-refresh-select option {
      background: var(--bg-card);
      color: #fff;
    }
    .countdown-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--yellow);
      background: rgba(245, 158, 11, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      min-width: 32px;
      text-align: center;
    }

    .live-status-pill {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 66px);
      border: none;
      background: var(--bg);
    }
  </style>
</head>
<body>

  <header>
    <a href="/unified" class="brand">
      <div class="brand-icon">⚡</div>
      <div>
        <div class="brand-title">EMPIRE MEDIA VAULT STUDIO</div>
        <div class="brand-subtitle">
          <span>Unified Production Hub</span>
          <span class="live-status-pill" id="liveStatus">● Connected :8686</span>
        </div>
      </div>
    </a>

    <!-- Source Switcher -->
    <div class="source-tabs">
      <button class="tab-btn active" id="tabDll" onclick="switchSource('dll')">
        🎬 Downloads / dll <span id="dllCountBadge" style="font-size:10px; opacity:0.7;">(26.6k takes)</span>
      </button>
      <button class="tab-btn tab-x" id="tabX" onclick="switchSource('x')">
        💾 X: Drive Pool <span id="xCountBadge" style="font-size:10px; opacity:0.7;">(All Folders)</span>
      </button>
      <button class="tab-btn" id="tabSorter" onclick="switchSource('sorter')">
        👁️ Vision Sorter (8765)
      </button>
    </div>

    <!-- Right Controls: Auto-Refresh & External Links -->
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <div class="auto-refresh-box">
        <span style="color:var(--text-muted);">Auto-Refresh:</span>
        <select class="auto-refresh-select" id="refreshIntervalSelect" onchange="changeRefreshInterval()">
          <option value="0">Off (Manual)</option>
          <option value="15">Every 15s</option>
          <option value="30" selected>Every 30s</option>
          <option value="60">Every 60s</option>
        </select>
        <span class="countdown-badge" id="timerBadge">30s</span>
      </div>

      <a href="http://localhost:3142" target="_blank" class="btn">🚀 God-Mode</a>
      <a href="http://localhost:6970" target="_blank" class="btn">🤖 JARVIS</a>
      <button class="btn btn-cyan" onclick="reloadFrame()">🔄 Instant Refresh</button>
    </div>
  </header>

  <!-- Embedded Active Dashboard View -->
  <iframe id="mediaFrame" class="iframe-container" src=""></iframe>

  <script>
    const API_BASE = (window.location.origin && window.location.origin !== 'null' && window.location.origin.startsWith('http')) ? window.location.origin : 'http://localhost:8686';
    let currentSource = 'dll';
    let refreshSeconds = 30;
    let timerRemaining = 30;
    let timerInterval = null;

    function initFrame() {
      switchSource('dll');
      fetchServerStats();
      startAutoRefresh();
    }

    function switchSource(src) {
      const frame = document.getElementById('mediaFrame');
      const tabDll = document.getElementById('tabDll');
      const tabX = document.getElementById('tabX');
      const tabSorter = document.getElementById('tabSorter');

      tabDll.classList.remove('active');
      tabX.classList.remove('active');
      tabSorter.classList.remove('active');

      currentSource = src;
      const timestamp = new Date().getTime();

      if (src === 'dll') {
        frame.src = `${API_BASE}/dll?_t=${timestamp}`;
        tabDll.classList.add('active');
      } else if (src === 'x') {
        frame.src = `${API_BASE}/x_drive?_t=${timestamp}`;
        tabX.classList.add('active');
      } else if (src === 'sorter') {
        frame.src = `http://localhost:8765?_t=${timestamp}`;
        tabSorter.classList.add('active');
      }
      resetCountdown();
    }

    function reloadFrame() {
      const frame = document.getElementById('mediaFrame');
      const timestamp = new Date().getTime();
      let currentUrl = frame.src.split('?')[0];
      frame.src = `${currentUrl}?_t=${timestamp}`;
      fetchServerStats();
      resetCountdown();
    }

    function changeRefreshInterval() {
      refreshSeconds = parseInt(document.getElementById('refreshIntervalSelect').value, 10);
      resetCountdown();
    }

    function resetCountdown() {
      timerRemaining = refreshSeconds;
      updateTimerBadge();
    }

    function updateTimerBadge() {
      const badge = document.getElementById('timerBadge');
      if (refreshSeconds === 0) {
        badge.textContent = 'OFF';
        badge.style.color = 'var(--text-muted)';
      } else {
        badge.textContent = `${timerRemaining}s`;
        badge.style.color = timerRemaining <= 5 ? 'var(--pink)' : 'var(--yellow)';
      }
    }

    function startAutoRefresh() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (refreshSeconds > 0) {
          timerRemaining--;
          if (timerRemaining <= 0) {
            reloadFrame();
          } else {
            updateTimerBadge();
          }
        }
      }, 1000);
    }

    async function fetchServerStats() {
      try {
        const res = await fetch(`${API_BASE}/api/stats`, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data.dll && data.dll.total_files) {
            document.getElementById('dllCountBadge').textContent = `(${data.dll.total_files.toLocaleString()} files)`;
          }
          if (data.x_drive && data.x_drive.total_files) {
            document.getElementById('xCountBadge').textContent = `(${data.x_drive.total_files.toLocaleString()} files)`;
          }
          document.getElementById('liveStatus').textContent = '● Connected :8686';
          document.getElementById('liveStatus').style.color = 'var(--green)';
        }
      } catch (err) {
        document.getElementById('liveStatus').textContent = '○ Disconnected';
        document.getElementById('liveStatus').style.color = 'var(--pink)';
      }
    }

    initFrame();
  </script>
</body>
</html>
